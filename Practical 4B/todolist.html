<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
 <style>
    body { font-family: Arial; 
        text-align: center;
         background: #f2f2f2; 
        padding: 50px; } 
        
        h1 { 
            color: #333; 
        } 
        input { 
            padding: 10px; 
            width: 250px; 
        }
        button { 
            padding: 10px 15px; 
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
             }
      ul {
    width: 400px;
    margin: 20px auto;
    text-align: left;
}

li {
    background: white;
    padding: 10px;
    margin: 5px;
}
                     
        .completed {
            text-decoration: line-through;
            color: gray; 
            }
 </style>


</head>
<body>
    <h1>My To-Do List</h1><br><br>
    <input type="text" id="taskInput" placeholder="Enter a task.">
    <button id="addButton">Add Task</button>
    <ul id="taskList"></ul>
    <script src="script.js"></script>
</body>
</html>
